# k8s/overlays/dev/kustomization.yaml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dev

bases:
  - ../../base

patches:
  - path: patches/deployment-patch.yaml
  - path: patches/hpa-patch.yaml

# Override image tags with git commit SHA
images:
  - name: product-service
    newName: <account-id>.dkr.ecr.us-east-1.amazonaws.com/product-service
    newTag: ${IMAGE_TAG}-dev
  - name: cart-service
    newName: <account-id>.dkr.ecr.us-east-1.amazonaws.com/cart-service
    newTag: ${IMAGE_TAG}-dev

configMapGenerator:
  - name: ecommerce-config
    literals:
      - ENVIRONMENT=dev
      - LOG_LEVEL=debug