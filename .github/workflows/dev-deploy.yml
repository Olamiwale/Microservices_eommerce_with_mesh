name: Deploy to Dev Environment

on:
  push:
    branches:
      - develop

env:
    AWS_REGION: ${{ secrets.AWS_REGION }}
    EKS_CLUSTER: ${{ secrets.EKS_CLUSTER_NAME_DEV }}

jobs:
    build-and-deploy:
        name: Build, Push and Deploy
        runs-on: ubuntu-latest

        strategy:
            matrix:
                include:

            
                    - service: product-service
                      path: app/go-services/product
                    - service: payment-service
                      path: app/go-services/payment
                    - service: user-service
                      path: app/go-services/user
                    

                    # - service: cart-service
                    #   path: app/node-services/cart-service
                    # - service: shipping-service
                    #   path: app/node-services/shipping-service

                    
                    # - service: order-service
                    #   path: app/python-services/order-service
                    # - service: inventory-service
                    #   path: app/python-services/inventory-service
                    # - service: notification-service
                    #   path: app/python-services/notification-service
                      


        steps:
            - name: Checkout Code
              uses: actions/checkout@v3


             

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v2
              with:
                aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                aws-region: ${{ env.AWS_REGION }}


            
            - name: Login to ECR
              id: login-ecr
              uses: aws-actions/amazon-ecr-login@v1



            - name: Build, tag and push Docker image
              env:
                ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
                IMAGE_TAG: ${{ github.sha }}
              run: |
                docker build -t $ECR_REGISTRY/${{ matrix.service }}:${IMAGE_TAG-dev} ${{ matrix.path }}
                docker push $ECR_REGISTRY/${{ matrix.service }}:${IMAGE_TAG-dev}


          

            - name: Update Kube config
              run: aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER }}


            - name: Create namespace
              run: kubectl create namespace dev --dry-run=client -o yaml | kubectl apply -f -


            - name: Update Deployment Image
              env:
                ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
                IMAGE_TAG: ${{ github.sha }}
              run: |
                sed -i "s|image: .*|image: $ECR_REGISTRY/${{ matrix.service }}:$IMAGE_TAG|" k8s/${{ matrix.service }}/deployment.yaml

            - name: Deploy to EKS
              run: kubectl apply -f k8s/${{ matrix.service }}/

         



              